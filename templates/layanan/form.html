{% extends "base.html" %}
{% block title %}{{ action }} Layanan {% endblock %}
{% block content %}

<h5 class="fw-bold mb-3">
    <i class="fa-solid fa-pen-to-square"></i> {{ action }} Data Layanan
</h5>

<div class="card shadow-sm" style="max-width:500px;">
    <div class="card-body">
        <form action="{{ url_for('layanan.edit', id=data.id) if data else url_for('layanan.tambah') }}" method="post">
            <div class="mb-3">
                <label class="form-label">Nama Layanan</label>
                <input type="text" name="nama_layanan" class="form-control"
                       value="{{ data.nama_layanan if data else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Harga per Kg (Rp)</label>
                <input type="number" step="0.01" min="1" name="harga_per_kg"
                       class="form-control"
                       value="{{ data.harga_per_kg if data else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Estimasi Pengerjaan (hari)</label>
                <input type="number" min="1" name="estimasi_hari"
                       class="form-control"
                       value="{{ data.estimasi_hari if data else '' }}" required>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-save"></i> Simpan
            </button>
            <a href="{{ url_for('layanan.index') }}" class="btn btn-secondary">Batal</a>
        </form>
    </div>
</div>

{% endblock %}
